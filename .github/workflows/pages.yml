name: Refresh data and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last successful observations
        uses: actions/cache@v4
        with:
          path: site/data/metrics.json
          key: observations-${{ github.run_id }}
          restore-keys: observations-
      - run: node --test tests/math.test.mjs
      - run: python scripts/update_data.py
        env:
          COINMETRICS_API_KEY: ${{ secrets.COINMETRICS_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
